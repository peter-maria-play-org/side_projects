repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.7.0
  hooks:
    # Run the linter.
    - id: ruff
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
    
- repo: https://github.com/mpalmer/action-validator
  rev: v0.8.0 
  hooks:
  - id: action-validator
    files: \.github/workflows/.*\.yml$
